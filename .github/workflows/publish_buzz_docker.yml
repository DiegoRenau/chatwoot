name: Publish BuzzCRM Docker Image

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag personalizado (ej: 4.17.1_126). Si se omite, se usa el SHA corto.'
        required: false

env:
  DOCKER_REPO: diegoteuru/buzz

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Docker Tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "DOCKER_TAG=${DOCKER_REPO}:${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "DOCKER_TAG=${DOCKER_REPO}:latest-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
